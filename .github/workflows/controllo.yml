name: Controllo pagine lavora con noi

on:
  schedule:
    # lunedì, mercoledì e venerdì alle 6:23 ora italiana (5:23 UTC in inverno)
    - cron: "23 5 * * 1,3,5"
  workflow_dispatch:
    inputs:
      riprova_fallite:
        description: "Ricontrolla i fallimenti più vecchi di N giorni (1 = tutti)"
        default: "30"
      workers:
        description: "Richieste in parallelo per ogni job"
        default: "24"
      browser:
        description: "Riprovare col browser i siti in JavaScript e quelli che danno 403 (true/false)"
        default: "true"

permissions:
  contents: write
  issues: write

concurrency:
  group: elenco-aziende
  cancel-in-progress: false

jobs:
  # La ricerca delle pagine lavoro è divisa in 8 job che lavorano in parallelo su
  # fette diverse dell'elenco. Ogni job scrive solo i propri risultati, che vengono
  # riuniti dal job "unisci": così non si sovrascrivono a vicenda.
  scopri:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        fetta: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Cerca le pagine lavoro (fetta ${{ matrix.fetta }} di 8)
        run: |
          mkdir -p parziali
          python -u scripts/scopri_pagine.py \
            --fetta ${{ matrix.fetta }} --di 8 \
            --workers ${{ github.event.inputs.workers || '24' }} \
            --riprova-fallite ${{ github.event.inputs.riprova_fallite || '30' }} \
            --rifai \
            --parziale parziali/fetta-${{ matrix.fetta }}.csv

      # anche se il job scade per tempo, i risultati parziali già salvati vanno conservati
      - name: Conserva i risultati della fetta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetta-${{ matrix.fetta }}
          path: parziali/fetta-${{ matrix.fetta }}.csv
          if-no-files-found: warn
          retention-days: 7

  # I siti costruiti in JavaScript e quelli che rifiutano il lettore automatico (403)
  # vanno aperti con Chromium. E' piu' lento, quindi gira in 6 fette in parallelo
  # insieme a "scopri", non dopo.
  browser:
    if: github.event.inputs.browser != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        fetta: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa librerie
        run: pip install -r requirements.txt

      - name: Installa il browser
        run: python -m playwright install --with-deps chromium

      - name: Riprova col browser (fetta ${{ matrix.fetta }} di 6)
        run: |
          mkdir -p parziali
          python -u scripts/scopri_pagine_browser.py \
            --fetta ${{ matrix.fetta }} --di 6 \
            --parziale parziali/browser-${{ matrix.fetta }}.csv

      - name: Conserva i risultati della fetta
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetta-browser-${{ matrix.fetta }}
          path: parziali/browser-${{ matrix.fetta }}.csv
          if-no-files-found: warn
          retention-days: 7

  unisci:
    needs: [scopri, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa librerie
        run: pip install -r requirements.txt

      # controlla.py apre con un browser vero le pagine costruite in JavaScript
      - name: Installa il browser
        run: python -m playwright install --with-deps chromium

      - name: Recupera i risultati delle 8 fette
        uses: actions/download-artifact@v4
        with:
          path: parziali
          pattern: fetta-*
          merge-multiple: true

      - name: Riunisci i risultati nell'elenco aziende
        run: |
          ls -l parziali/ || true
          python -u scripts/unisci_parziali.py parziali/*.csv

      - name: Salva subito l'elenco unito (prima del controllo offerte)
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add dati
          git commit -m "Pagine lavoro del $(date +%F)" || echo "Nessuna modifica"
          git pull --rebase -X theirs origin main || true
          git push

      - name: Controlla le pagine lavoro e cerca le offerte marketing
        run: python -u scripts/controlla.py

      - name: Salva i risultati nel repository
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add dati risultati
          git commit -m "Controllo del $(date +%F)" || echo "Nessuna modifica"
          git pull --rebase -X theirs origin main || true
          git push

      - name: Apri una segnalazione se ci sono novità
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat risultati/.ci_sono_novita 2>/dev/null)" = "1" ]; then
            gh issue create --title "Novità pagine lavoro $(date +%d/%m/%Y)" --body-file risultati/ultimo_controllo.md
          fi
