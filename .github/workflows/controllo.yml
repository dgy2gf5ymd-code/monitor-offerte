name: Controllo pagine lavora con noi

on:
  schedule:
    # lunedì, mercoledì e venerdì alle 6:23 ora italiana (5:23 UTC in inverno)
    - cron: "23 5 * * 1,3,5"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: controllo
  cancel-in-progress: false

jobs:
  controllo:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa librerie
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Aggiorna l'elenco aziende da Confindustria Veneto Est
        continue-on-error: true
        run: python -u scripts/carica_confindustria.py --provincia "Padova|Venezia|Rovigo|Treviso"

      - name: Aggiorna l'elenco aziende da Confindustria Vicenza
        continue-on-error: true
        run: python -u scripts/carica_confindustria_vicenza.py --min-dipendenti 20

      - name: Aggiungi società da aziende.it (fatturato da 2 milioni, almeno 20 dipendenti)
        continue-on-error: true
        run: python -u scripts/carica_aziende_it.py --province padova,vicenza,venezia,treviso,rovigo --min-dipendenti 20 --max-schede 2500

      - name: Aggiungi startup e PMI innovative (il lunedì o quando lanciato a mano)
        continue-on-error: true
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u scripts/carica_innovative.py --province PD,VI,VE,TV,RO
          fi

      - name: Trova il sito delle aziende con partita IVA (verifica sulla pagina)
        continue-on-error: true
        run: python -u scripts/trova_siti.py --max 2500

      - name: Aggiungi aziende da OpenStreetMap (il lunedì o quando lanciato a mano)
        continue-on-error: true
        run: |
          if [ "$(date +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -u scripts/carica_osm.py --province PD,VI,RO,VE,TV
          fi

      - name: Cerca le pagine lavoro delle aziende nuove
        run: python -u scripts/scopri_pagine.py --max 3000 --rifai

      - name: Controlla le pagine lavoro
        run: python -u scripts/controlla.py

      - name: Salva i risultati nel repository
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add dati risultati
          git commit -m "Controllo del $(date +%F)" || echo "Nessuna modifica"
          git pull --rebase -X theirs origin main || true
          git push

      - name: Apri una segnalazione se ci sono novità
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat risultati/.ci_sono_novita)" = "1" ]; then
            gh issue create --title "Novità pagine lavoro $(date +%d/%m/%Y)" --body-file risultati/ultimo_controllo.md
          fi
